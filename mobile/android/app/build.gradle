def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    namespace "com.petsupport.app"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html)
        applicationId "com.petsupport.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_PASSWORD")) {
                storeFile file("../app.keystore")
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works with release builds.
            signingConfig signingConfigs.release
            
            // Enable code shrinking and obfuscation
            minifyEnabled true
            shrinkResources true
            
            // Use Proguard for code shrinking
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Add build timestamp for version tracking
            buildConfigField "long", "BUILD_TIMESTAMP", System.currentTimeMillis() + "L"
        }
        
        debug {
            // Disable code shrinking for debug builds
            minifyEnabled false
            shrinkResources false
            
            // Add debug suffix to app name
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            
            // Add build timestamp
            buildConfigField "long", "BUILD_TIMESTAMP", System.currentTimeMillis() + "L"
        }
    }

    // Split APKs by ABI to reduce APK size
    splits {
        abi {
            reset()
            enable enableSeparateBuildPerCPUArchitecture
            universalApk false  // If true, also generate a universal APK
            include "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }
    }

    // Map ABI versions to version codes
    project.ext.versionCodes = ['armeabi-v7a': 1, 'x86': 2, 'arm64-v8a': 3, 'x86_64': 4]
    android.applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def abiVersionCode = project.ext.versionCodes.get(output.getFilter(OutputFile.ABI))
            if (abiVersionCode != null) {
                output.versionCodeOverride = abiVersionCode * 1000 + variant.versionCode
            }
        }
    }

    // Enable R8 full mode for better optimization
    android {
        buildTypes {
            release {
                postprocessing {
                    removeUnusedCode true
                    removeUnusedResources true
                    obfuscate true
                    optimizeCode true
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
        }
    }

    // Add lint options
    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
        abortOnError false
    }

    // Add packaging options
    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.firebase:firebase-messaging:23.4.1'
    implementation 'com.google.firebase:firebase-analytics:21.5.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'
    
    // Add security dependencies
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    
    // Add network dependencies
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    
    // Add image loading dependencies
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    
    // Add camera dependencies
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'
    
    // Add location dependencies
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    
    // Add biometric dependencies
    implementation 'androidx.biometric:biometric:1.1.0'
    
    // Add testing dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.7.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.2.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'
}

// Apply Google Services plugin for Firebase
apply plugin: 'com.google.gms.google-services'

// Add Firebase Performance Monitoring
apply plugin: 'com.google.firebase.firebase-perf'

// Add Firebase Crashlytics
apply plugin: 'com.google.firebase.crashlytics'

// Custom tasks for app store deployment
task printVersionName {
    doLast {
        println android.defaultConfig.versionName
    }
}

task printVersionCode {
    doLast {
        println android.defaultConfig.versionCode
    }
}

// Task to generate release notes
task generateReleaseNotes {
    doLast {
        def versionName = android.defaultConfig.versionName
        def versionCode = android.defaultConfig.versionCode
        def releaseNotesFile = file("../release-notes.txt")
        
        releaseNotesFile.text = """
Version ${versionName} (${versionCode})

New Features:
- Enhanced AI chat with image analysis
- Improved emergency triage system
- Offline data synchronization
- Personalized care recommendations
- Local resource finder with reviews

Improvements:
- Better performance and stability
- Enhanced user interface
- Improved notification system
- Better offline support

Bug Fixes:
- Fixed login issues on some devices
- Resolved crash in weight tracker
- Fixed notification delivery issues
- Improved data sync reliability

For more information, visit our website or contact support.
"""
        println "Release notes generated: ${releaseNotesFile.absolutePath}"
    }
}

// Task to validate app before store upload
task validateForStoreUpload {
    doLast {
        def versionName = android.defaultConfig.versionName
        def versionCode = android.defaultConfig.versionCode
        
        println "Validating app version ${versionName} (${versionCode}) for store upload..."
        
        // Check if version code is incremented
        // This would typically involve checking against the last published version
        
        // Check if all required assets are present
        def requiredAssets = [
            'mipmap-hdpi/ic_launcher.png',
            'mipmap-mdpi/ic_launcher.png',
            'mipmap-xhdpi/ic_launcher.png',
            'mipmap-xxhdpi/ic_launcher.png',
            'mipmap-xxxhdpi/ic_launcher.png'
        ]
        
        requiredAssets.each { asset ->
            def assetFile = file("src/main/res/${asset}")
            if (!assetFile.exists()) {
                throw new GradleException("Required asset missing: ${asset}")
            }
        }
        
        // Check if app description and metadata are ready
        def metadataFile = file("../fastlane/metadata/android/en-US/full_description.txt")
        if (!metadataFile.exists()) {
            throw new GradleException("App metadata not found. Please prepare store listing information.")
        }
        
        println "App validation completed successfully!"
    }
}

// Hook tasks to build process
afterEvaluate {
    // Generate release notes before building release
    assembleRelease.dependsOn generateReleaseNotes
    
    // Validate before creating release bundle
    bundleRelease.dependsOn validateForStoreUpload
}